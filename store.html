<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031020">
  <meta name="description" content="Explore rockets, crew, and spacecraft upgrades in the ASTRAQUEST Space Store.">
  <title>Space Store | ASTRAQUEST</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/store.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/shared-header.css">
</head>
<body class="home-page store-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ASTRAQUEST home">
      <img src="assets/astraquest-logo.png" alt="ASTRAQUEST — Junior Astronaut Mission Trainer">
    </a>
    <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation" aria-expanded="false"><i data-lucide="menu"></i></button>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="tutorial.html">How it works</a>
      <a class="nav-link" href="index.html#learn">Levels</a>
      <a class="nav-link" href="nasa-data.html">NASA Data</a>
      <a class="nav-link active" href="store.html" aria-current="page">Store</a>
    </nav>
    <div class="auth-nav"><a href="auth.html?mode=signup">Sign Up</a><a href="auth.html?mode=login">Log In</a></div>
  </header>

  <main class="store-main">
    <section class="store-hero" aria-labelledby="storeTitle">
      <div class="store-hero-copy">
        <h1 id="storeTitle">SPACE STORE</h1>
        <span class="store-title-line" aria-hidden="true"></span>
      </div>
    </section>

    <section class="store-categories" id="storeCategories" aria-label="Store categories">
      <a class="store-card store-card-rockets" href="rocket-hangar.html" aria-label="Open Rocket Hangar">
        <img src="assets/store-rockets.png" alt="A lineup of rockets at a futuristic launchpad">
        <span class="store-card-icon"><i data-lucide="rocket"></i></span>
        <span class="store-card-content"><strong>Rockets</strong></span>
        <span class="store-card-arrow"><i data-lucide="arrow-right"></i></span>
      </a>
      <a class="store-card store-card-crew" href="#crew" aria-label="Open Crew store category">
        <img src="assets/store-crew.png" alt="Three astronauts in front of Earth">
        <span class="store-card-icon"><i data-lucide="users"></i></span>
        <span class="store-card-content"><strong>Crew</strong></span>
        <span class="store-card-arrow"><i data-lucide="arrow-right"></i></span>
      </a>
      <a class="store-card store-card-upgrades" href="#upgrades" aria-label="Open Upgrades store category">
        <img src="assets/store-upgrades.png" alt="A large spacecraft propulsion engine in a hangar">
        <span class="store-card-icon"><i data-lucide="settings"></i></span>
        <span class="store-card-content"><strong>Upgrades</strong></span>
        <span class="store-card-arrow"><i data-lucide="arrow-right"></i></span>
      </a>
    </section>
  </main>
  <script src="js/script.js"></script>
  <script src="js/store.js"></script>
<script src="js/shared-header.js"></script>
</body>
</html>
