<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Commander Profile | ASTRAQUEST</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/shared-header.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="profile-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="ASTRAQUEST home">
        <img src="assets/astraquest-logo.png" alt="ASTRAQUEST — Junior Astronaut Mission Trainer" />
      </a>
      <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <i data-lucide="menu"></i>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="tutorial.html">How it works</a>
        <a class="nav-link" href="index.html#learn">Levels</a>
        <a class="nav-link" href="nasa-data.html">NASA Data</a>
        <a class="nav-link" href="store.html">Store</a>
      </nav>
      <div class="auth-nav">
        <a href="auth.html?mode=signup">Sign Up</a>
        <a href="auth.html?mode=login">Log In</a>
      </div>
    </header>

    <main class="profile-main">
      <section class="profile-card" aria-labelledby="profileTitle">
        <div class="profile-heading">
          <div class="profile-mark" id="profileInitials" aria-hidden="true">A</div>
          <div>
            <p class="profile-kicker">MISSION CONTROL // ACCOUNT</p>
            <h1 id="profileTitle">Commander Profile</h1>
            <p>Manage your account details and review your mission balances.</p>
          </div>
        </div>
        <form id="profileForm" class="profile-form">
          <label for="displayName">Commander name</label>
          <input id="displayName" name="display_name" maxlength="60" autocomplete="nickname" required />
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" readonly />
          <div class="profile-balances">
            <div><span>COINS</span><strong id="coins">—</strong></div>
            <div><span>DIAMONDS</span><strong id="diamonds">—</strong></div>
          </div>
          <p id="profileMessage" class="profile-message" role="status" aria-live="polite"></p>
          <div class="profile-actions">
            <button type="submit" class="profile-save" id="saveProfile">Save profile</button>
            <button type="button" class="profile-logout" id="profileLogout">Log out</button>
          </div>
        </form>
      </section>
    </main>
    <script src="js/api-client.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/shared-header.js"></script>
  </body>
</html>
