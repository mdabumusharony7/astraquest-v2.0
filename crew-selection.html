<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031326">
  <title>Select Your Crew | ASTRAQUEST</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/crew-selection.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/shared-header.css">
</head>
<body class="crew-selection-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ASTRAQUEST home">
      <img src="assets/astraquest-logo.png" alt="ASTRAQUEST — Junior Astronaut Mission Trainer">
    </a>
    <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation" aria-expanded="false"><i data-lucide="menu"></i></button>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="tutorial.html">How it works</a>
      <a class="nav-link" href="index.html#learn">Levels</a>
      <a class="nav-link" href="nasa-data.html">NASA Data</a>
      <a class="nav-link" href="store.html">Store</a>
    </nav>
    <div class="auth-nav"><a href="auth.html?mode=signup">Sign Up</a><a href="auth.html?mode=login">Log In</a></div>
  </header>

  <main class="crew-main">
    <section class="crew-heading">
      <p class="eyebrow">MISSION PREPARATION / CREW MANIFEST</p>
      <h1>SELECT YOUR <span>CREW</span></h1>
      <p class="crew-subtitle">Choose four specialists to support your mission.</p>
      <div class="selection-counter"><span id="selectedCount">0</span><span> / 4 MEMBERS SELECTED</span></div>
    </section>

    <section class="crew-grid" id="crewGrid" aria-label="Crew members">
      <button class="crew-card" type="button" data-id="rony" aria-pressed="false">
        <span class="crew-avatar avatar-blue">MR</span><span class="crew-info"><strong>Md Abu Musha-Rony</strong><small>Mission Commander</small><em>Leadership · Mission coordination</em></span><span class="select-mark"><i data-lucide="check"></i></span>
      </button>
      <button class="crew-card" type="button" data-id="promed" aria-pressed="false">
        <span class="crew-avatar avatar-cyan">PD</span><span class="crew-info"><strong>Promed Chandra Das</strong><small>Aeronautical Engineer</small><em>Flight systems · Repairs</em></span><span class="select-mark"><i data-lucide="check"></i></span>
      </button>
      <button class="crew-card" type="button" data-id="afnan" aria-pressed="false">
        <span class="crew-avatar avatar-violet">AE</span><span class="crew-info"><strong>Afnan Hossain Esha</strong><small>Nuclear &amp; Power Scientist</small><em>Energy systems · Radiation</em></span><span class="select-mark"><i data-lucide="check"></i></span>
      </button>
      <button class="crew-card" type="button" data-id="fahima" aria-pressed="false">
        <span class="crew-avatar avatar-green">FH</span><span class="crew-info"><strong>Fahima Haque</strong><small>Botanist</small><em>Plant science · Food production</em></span><span class="select-mark"><i data-lucide="check"></i></span>
      </button>
      <button class="crew-card" type="button" data-id="muskan" aria-pressed="false">
        <span class="crew-avatar avatar-orange">MO</span><span class="crew-info"><strong>Muskan Meheg Oyishi</strong><small>Doctor</small><em>Crew health · Medical support</em></span><span class="select-mark"><i data-lucide="check"></i></span>
      </button>
      <button class="crew-card" type="button" data-id="sakib" aria-pressed="false">
        <span class="crew-avatar avatar-pink">FS</span><span class="crew-info"><strong>Fahim Shahriar Sakib</strong><small>Research Analyst</small><em>Data analysis · Research</em></span><span class="select-mark"><i data-lucide="check"></i></span>
      </button>
    </section>

    <section class="crew-footer">
      <div class="crew-summary"><span class="summary-icon"><i data-lucide="users"></i></span><span><small>Selected Crew</small><strong id="selectedNames">No members selected</strong></span></div>
      <div class="crew-actions">
        <button class="btn-secondary" id="backButton" type="button"><i data-lucide="arrow-left"></i> BACK</button>
        <button class="btn-primary" id="confirmButton" type="button" disabled>CONFIRM CREW <i data-lucide="arrow-right"></i></button>
      </div>
    </section>
    <p class="crew-note" id="crewNote" aria-live="polite">Select exactly four crew members to continue.</p>
  </main>
  <script src="js/shared-header.js"></script>
  <script src="js/crew-selection.js"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
